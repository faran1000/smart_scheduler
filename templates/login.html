<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ورود | سیستم هوشمند وظایف</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); width: 100%; max-width: 360px; }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 25px; font-size: 20px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-size: 13px; color: #444; }
        input { width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        button { width: 100%; padding: 11px; background: #2980b9; color: #fff; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        button:hover { background: #1c5980; }
        .msg { background: #fee; color: #c0392b; padding: 10px; border-radius: 6px; margin-bottom: 15px; font-size: 13px; text-align: center; }
        .links { text-align: center; margin-top: 18px; font-size: 13px; }
        .links a { color: #27ae60; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>ورود به حساب کاربری</h2>
        {% if error %}
            <div class="msg">{{ error }}</div>
        {% endif %}
        <form method="POST" action="/login">
            <div class="form-group">
                <label>نام مستعار:</label>
                <input type="text" name="username" required>
            </div>
            <div class="form-group">
                <label>رمز عبور:</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit">ورود</button>
        </form>
        <div class="links">
            حساب کاربری ندارید؟ <a href="/register">ثبت‌نام کنید</a>
        </div>
    </div>
</body>
</html>
